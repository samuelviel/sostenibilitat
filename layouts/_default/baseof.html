<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Params.shortTitle }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
<a class="skip" href="#main">Salta al contingut</a>

<header class="topbar">
  <a class="brand" href="{{ "" | relURL }}">{{ .Site.Params.shortTitle }}</a>
  <button class="toggle" id="navToggle" aria-expanded="false" aria-controls="sidebar">Menú</button>
</header>

<div class="shell">
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
</div>

<footer class="foot">
  <p>{{ .Site.Params.centre }} · {{ .Site.Params.curs }}</p>
  <p>Materials publicats sota llicència {{ .Site.Params.llicencia }}.</p>
</footer>

<script>
(function () {
  var b = document.getElementById('navToggle');
  var s = document.getElementById('sidebar');
  if (!b || !s) return;
  b.addEventListener('click', function () {
    var open = s.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
