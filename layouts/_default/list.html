{{ define "main" }}
<article class="doc">
  <h1>{{ .Title }}</h1>
  <div class="body">{{ .Content }}</div>
  <div class="cards">
    {{ range .Pages }}
    <a class="card" href="{{ .RelPermalink }}">
      <span class="eyebrow">{{ .Params.unitat }}</span>
      <strong>{{ .Title }}</strong>
      {{ with .Description }}<span class="desc">{{ . }}</span>{{ end }}
      {{ with .Params.hores }}<span class="desc">{{ . }} sessions</span>{{ end }}
    </a>
    {{ end }}
  </div>
</article>
{{ end }}
