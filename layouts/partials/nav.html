<nav class="sidebar" id="sidebar" aria-label="Navegació del mòdul">
  <p class="navhead">El mòdul</p>
  <ul>
    <li><a href="{{ "" | relURL }}"{{ if .IsHome }} class="on"{{ end }}>Inici</a></li>
    {{ with site.GetPage "/calendari" }}
      <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} class="on"{{ end }}>Calendari de sessions</a></li>
    {{ end }}
  </ul>
  <p class="navhead">Unitats</p>
  <ul>
    {{ range where site.RegularPages "Section" "temes" }}
      <li>
        <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} class="on"{{ end }}>
          <span class="tag">{{ .Params.unitat }}</span>{{ .Title }}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
